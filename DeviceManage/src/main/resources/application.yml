# 应用服务 WEB 访问端口
server:
  port: 8083
spring:
  # 项目名称
  application:
    name: plc-device
  # pgsql
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:postgresql://192.168.1.106:5432/freeswitch?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true
    #url: jdbc:log4jdbc:postgresql://127.0.0.1:5432/freeswitch?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true
    username: postgres
    password: pg123456
    hikari:                            # HikariCP 连接池配置
      max-lifetime: 300000             # 连接最大存活时间
      validation-timeout: 3000         # 连接校验超时时间
      idle-timeout: 600000             # 连接空闲超时时间
      connection-test-query: SELECT 1  # 连接健康检查SQL
# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath:mappers/*/*.xml,classpath:mappers-api/*/*.xml,classpath:mappers/DmLog.xml
  type-aliases-package: com.src.modules.*.model,com.src.model.DmLog,com.src.*.*.model
  # 控制台打印完整带参数SQL语句（默认注释）
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线转驼峰，user_name -> userName
    map-underscore-to-camel-case: true